focus_title: "Research focus"
focus_items:
  - title: Cheminformatics
    text: Representing, analysing and extracting useful information from molecular datasets.
  - title: Machine Learning in Chemistry
    text: Developing data-driven approaches for classification, prediction and chemical pattern recognition.
  - title: Chemical Sensing & Molecular Recognition
    text: Applying multivariate and machine-learning methods to chemical sensing and analyte discrimination.

exploring_title: "Currently exploring"
exploring_headline: "Building data-driven workflows for chemical research"
exploring_text: "My current independent research focuses on developing and evaluating machine-learning pipelines for problems including chemical property prediction, molecular data analysis and analyte detection."

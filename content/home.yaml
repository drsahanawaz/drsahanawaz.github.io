beyond_title: "Beyond chemistry"
beyond_headline: "Human performance through the same scientific lens."
beyond_text: "Outside chemistry, I have a strong interest in evidence-based human performance, resistance training and fitness. I am a certified Menno Henselmans Personal Trainer and explore how scientific reasoning applies to training, nutrition and human performance."


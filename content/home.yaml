featured_title: "Featured research"
featured_headline: "Machine Learning for Chemical Recognition"
featured_text: "During doctoral research at IISER Kolkata, I investigated photochromic molecular receptors and their application to the recognition of biologically relevant analytes—combining spectroscopic responses with multivariate and machine-learning methods."


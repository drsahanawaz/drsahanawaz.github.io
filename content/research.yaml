# Lab Scientific Software & Web Tools
tools_showcase:
  - name: "Spectra Autopilot"
    subtitle: "Automated UV–Vis Spectrophotometry Plotter & Analyzer"
    url: "https://spectraautopilot.streamlit.app"
    status: "Live Web App"
    summary: "A zero-code browser application designed for experimental chemists. Upload spectrophotometer export files (TXT/CSV/TSV), inspect spectral curves in real-time, overlay multiple concentrations, customize publication axes, and export high-resolution graphics."
    tech: "Streamlit · Plotly · Python · Spectrophotometer File Parser"
    role: "Conceived & scientifically led by Dr. Md Sahanawaz"

  - name: "TCSPC AutoFit"
    subtitle: "Fluorescence Lifetime Decay Fitting via Iterative IRF Reconvolution"
    url: "https://tcspcautofit.streamlit.app"
    status: "Live Web App"
    summary: "Dedicated computational tool for fluorescence decay analysis. Handles Horiba/DAS-style experimental TCSPC data exports, performing iterative convolution of the Instrument Response Function (IRF) with multi-exponential decay models to extract precise lifetime components."
    tech: "Streamlit · SciPy Nonlinear Least Squares · Multi-exponential IRF Reconvolution"
    role: "Conceived & scientifically led by Dr. Md Sahanawaz"

  - name: "Chemical ML Pipeline"
    subtitle: "Modular Python Framework for Molecular Machine Learning"
    url: "https://github.com/drsahanawaz"
    status: "Open Source Code"
    summary: "Modular Python workflows for converting raw chemical libraries into descriptor matrices, training predictive models, evaluating domain applicability, and visualizing chemical space clustering."
    tech: "RDKit · scikit-learn · Pandas · GitHub"
    role: "Lead Developer"

# Doctoral Foundation
phd:
  title: "Photochromic Receptors for Nucleotide Detection Using Machine Learning Techniques"
  institution: "IISER Kolkata"
  period: "2018 – 2026"
  degree: "Doctor of Philosophy (PhD) in Chemical Sciences"
  supervisor: "Prof. Subhajit Bandyopadhyay"
  text: "Doctoral research established a novel paradigm combining photochromic supramolecular chemistry with multivariate machine learning. By engineering azobenzene-based tripodal receptors that undergo light-tunable cis–trans isomerization, differential binding signatures were recorded for various nucleotide phosphates (ATP, ADP, GTP, UMP, UTP, CTP) and inorganic phosphates. Applying Principal Component Analysis (PCA) and Linear Discriminant Analysis (LDA) to multidimensional UV–Vis spectral datasets demonstrated robust, error-free classification and discrimination of closely related bio-analytes."
  highlight: "This doctoral work laid the core methodology for the group's current research in machine-learning-assisted chemical sensing and computational cheminformatics."


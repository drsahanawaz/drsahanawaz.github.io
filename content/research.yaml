# The 4 Core Research Thrusts (Thematic Pillars)
thrusts:
  - id: "thrust-1"
    number: "01"
    title: "Chemical Machine Learning & Cheminformatics Workflows"
    tagline: "From Molecular Graphs to Rigorous Predictive Models"
    summary: "Developing reproducible computational pipelines that convert molecular structures into informative 1D/2D/3D descriptors and fingerprint representations (Morgan, MACCS, RDKit). Constructing predictive regression and classification models using scikit-learn, with emphasis on chemical space visualization, domain applicability, and feature interpretability."
    techniques: ["RDKit Pipelines", "Molecular Fingerprints", "Chemical Space PCA/t-SNE", "QSAR/QSPR", "Cross-Validation & Robustness"]

  - id: "thrust-2"
    number: "02"
    title: "Smart Chemical Sensing & Multivariate Pattern Recognition"
    tagline: "Photoswitchable Receptors & Spectroscopic Machine Learning"
    summary: "Coupling photoresponsive molecular switches (azobenzene-based tripodal systems) with multivariate statistical analysis and machine learning. Reversible light-induced cis–trans isomerization modulates sensor binding affinities, creating differential optical response matrices that enable discriminating complex biological analytes (nucleotide phosphates: ATP, ADP, GTP, UTP, CTP)."
    techniques: ["Photoswitchable Sensing", "Multivariate PCA & LDA", "UV–Vis Spectral Decomposition", "Analyte Discrimination", "Sensor Array Modeling"]

  - id: "thrust-3"
    number: "03"
    title: "Molecular Property, Conformation & Reaction Kinetics"
    tagline: "Investigating Isomerization Dynamics & Structure–Kinetics Relationships"
    summary: "Investigating the fundamental physical organic chemistry of photoresponsive molecules and functional polymer assemblies. Analyzing the influence of polymer sequence, local polarity, and microenvironmental architecture on cis–trans thermal isomerization kinetics and transition-state stabilization."
    techniques: ["Thermal Isomerization Kinetics", "RAFT Copolymer Assemblies", "Activation Parameter Modeling", "Microenvironmental Polarity Effects"]

  - id: "thrust-4"
    number: "04"
    title: "Open Scientific Software & Web-Based Chemical Tools"
    tagline: "Zero-Code, Browser-Accessible Utilities for the Global Chemistry Community"
    summary: "Translating complex spectroscopic and cheminformatics algorithms into accessible, zero-installation web applications. Building browser tools like Spectra Autopilot for automated UV–Vis processing and TCSPC AutoFit for fluorescence decay deconvolution to empower experimental researchers worldwide."
    techniques: ["Streamlit Architectures", "Interactive Plotly Graphics", "Iterative IRF Reconvolution", "Spectrophotometer Parsers", "Open Science / GitHub"]

# Active and Grant-Ready Research Projects
projects:
  - title: "Reproducible Chemical Machine-Learning Pipeline"
    category: "Cheminformatics & Molecular ML"
    status: "Active Research"
    status_type: "active"
    description: "An end-to-end Python pipeline transforming chemical datasets (SMILES/SDF) into curated molecular descriptors and fingerprints, with automated feature selection, model training, cross-validation, and chemical domain applicability assessment."
    stack: "Python 3.10+ · RDKit · scikit-learn · pandas · Plotly"
    milestone: "Core library developed; benchmark models for molecular property prediction in progress."

  - title: "Machine-Learning Assisted Multivariate Analyte Discrimination"
    category: "Chemical Sensing & Pattern Recognition"
    status: "Active Program"
    status_type: "active"
    description: "Multivariate statistical modeling and pattern-recognition pipelines for multidimensional spectroscopic data. Decomposing complex UV–Vis absorption matrices using PCA and LDA to discriminate structurally close biological nucleotides and inorganic phosphates."
    stack: "Principal Component Analysis · Linear Discriminant Analysis · Multi-class Classification · UV–Vis Arrays"
    milestone: "Published in Analysis & Sensing (Wiley, 2026); currently expanding to multi-component sensing matrices."

  - title: "Quantitative Structure–Kinetics Relationships in Functional Azobenzene Polymers"
    category: "Physical Organic & Computational Chemistry"
    status: "Ongoing"
    status_type: "active"
    description: "Systematic investigation of sequence-defined copolymers containing stearic acid and azobenzene units synthesized via RAFT polymerization. Modeling thermal reversal kinetics and transition-state free energy barriers as a function of segmental microenvironment."
    stack: "First-Order Kinetic Modeling · Arrhenius/Eyring Formulations · UV–Vis Time Series · Origin/Python"
    milestone: "Published in Journal of Physical Organic Chemistry (2024); extending toward predictive kinetic models."

  - title: "Web-Based Computational Infrastructure for Experimental Spectroscopy"
    category: "Scientific Software & Tools"
    status: "Deployed & Maintained"
    status_type: "deployed"
    description: "Developing and maintaining open-access web applications for laboratory spectroscopists. Automated spectrophotometry curve visualization and iterative instrument response function (IRF) reconvolution for fluorescence lifetime decay analysis."
    stack: "Streamlit Cloud · SciPy Optimize · Horiba/DAS Parser · Interactive Vector Export"
    milestone: "Two live tools deployed: Spectra Autopilot and TCSPC AutoFit with active academic users."


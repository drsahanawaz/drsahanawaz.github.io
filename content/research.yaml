# Research Pillars (Detailed Technical Focus Areas)
research_areas:
  - id: "area-critical-eval"
    number: "01"
    title: "Critical Evaluation of ML Models in Chemistry"
    summary: "Machine learning models in chemistry frequently report over-optimistic performance due to naive random splitting, hidden data leakage, and memorization of dataset artifacts. We investigate rigorous validation methodologies, including Bemis–Murcko scaffold splits, temporal splits, and cluster-based validation, benchmarking models against simple chemical baselines to ensure genuine predictive capability."
    keywords: ["Scaffold Validation", "Data Leakage Diagnostics", "Baseline Benchmarking", "Cross-Validation Protocols", "Model Generalizability"]

  - id: "area-xai"
    number: "02"
    title: "Explainable AI (XAI) & Chemical Interpretability"
    summary: "Black-box predictions are inadequate for scientific discovery where mechanistic understanding is paramount. We develop and apply feature-attribution and substructure-level explanation techniques (such as SHAP, Integrated Gradients, and molecular attribution maps) to interrogate what chemical features drive predictions, verifying whether learned representations align with physical organic principles."
    keywords: ["Feature Attribution", "Substructure Importance", "Model Interpretability", "Mechanistic Plausibility", "Counterfactual Analysis"]

  - id: "area-uq-ad"
    number: "03"
    title: "Uncertainty Quantification & Applicability Domain Estimation"
    summary: "For computational predictions to be useful to experimentalists, models must know when they do not know. We implement applicability domain (AD) boundaries and uncertainty quantification (UQ) methods—using distance-to-model metrics, ensemble variance, and conformal prediction—to establish calibrated confidence intervals for every single molecular query."
    keywords: ["Applicability Domain (AD)", "Conformal Prediction", "Ensemble Uncertainty", "Reliability Bounds", "Chemical Space Distance"]

  - id: "area-data-curation"
    number: "04"
    title: "High-Quality Chemical Data Curation"
    summary: "The reliability of chemical ML is fundamentally constrained by data quality. We build automated data-curation workflows for chemical datasets: canonical SMILES standardization, salt stripping, stereochemistry normalization, duplicate reconciliation, and systematic detection and handling of missing or noisy measurements in experimental and spectral datasets."
    keywords: ["SMILES Standardization", "Curated Benchmarks", "Missing Data Imputation", "Spectral Cleaning", "Noise Detection"]

  - id: "area-chem-aware-ml"
    number: "05"
    title: "Chemistry-Aware Machine Learning Models"
    summary: "Standard statistical algorithms often fail to respect fundamental chemical invariants. We work on incorporating domain constraints—such as molecular graph symmetry, charge neutrality, thermodynamic consistency, and physical group additivity—directly into model architectures and loss formulations as chemical priors to improve sample efficiency and generalization."
    keywords: ["Chemical Priors", "Physics-Informed ML", "Symmetry & Invariants", "Graph Architectures", "Thermodynamic Bounds"]

  - id: "area-photochromic"
    number: "06"
    title: "Property Prediction of Photochromic Molecules"
    summary: "Photoresponsive molecular systems (e.g., azobenzenes, photoswitches) exhibit complex, state-dependent behavior. We build targeted predictive models for photochromic properties, including thermal cis–trans isomerization rates, activation energy barriers, absorption maxima, and half-lives across different solvent environments and polymer architectures."
    keywords: ["Azobenzene Photoswitches", "Isomerization Kinetics", "Thermal Half-Lives", "State-Dependent Properties", "Polymer Microenvironments"]

  - id: "area-sensing"
    number: "07"
    title: "Chemical Sensing & Multivariate Pattern Recognition"
    summary: "Building on doctoral research at IISER Kolkata, we couple molecular sensor arrays with multivariate statistical methods (PCA, LDA, clustering) to extract meaningful discrimination signatures from complex, multidimensional spectroscopic data, enabling robust identification of closely related analytes such as nucleotide phosphates."
    keywords: ["Optical Sensor Arrays", "Principal Component Analysis (PCA)", "Linear Discriminant Analysis (LDA)", "Spectroscopic Decomposition", "Multi-Analyte Discrimination"]

# Computational Setup & Methods
methods_summary:
  - category: "Core Environment"
    details: "Python 3.10+ scientific ecosystem, NumPy, SciPy, pandas, Jupyter, virtualized reproducible runtimes."
  - category: "Cheminformatics"
    details: "RDKit, molecular graphs, 2D/3D conformers, Morgan/circular fingerprints, MACCS keys, physicochemical descriptors."
  - category: "Machine Learning & XAI"
    details: "scikit-learn, Random Forests, Gradient Boosting, Gaussian Process Regression, SHAP, feature attribution."
  - category: "Spectroscopy & Data Analysis"
    details: "UV–Vis absorption time-series, TCSPC multi-exponential reconvolution, multi-format instrument parsers (Horiba, JASCO, Shimadzu)."

# Public Tools & Software Showcase
tools_showcase:
  - name: "Spectra Autopilot"
    subtitle: "UV–Vis Spectrophotometry Plotter & File Parser"
    url: "https://spectraautopilot.streamlit.app"
    status: "Web Application"
    summary: "An open web utility for experimental spectroscopists. Upload raw spectrophotometer exports (TXT, CSV, TSV), preview spectral curves, overlay multiple concentrations, customize axes, and export publication-ready vector and raster plots without coding."
    tech: "Python · Streamlit · Plotly"

  - name: "TCSPC AutoFit"
    subtitle: "Fluorescence Lifetime Decay Fitting via IRF Reconvolution"
    url: "https://tcspcautofit.streamlit.app"
    status: "Web Application"
    summary: "A dedicated browser tool for time-correlated single photon counting (TCSPC) data. Parses instrument export files and performs iterative reconvolution of the Instrument Response Function (IRF) with multi-exponential decay models to extract fluorescence lifetimes."
    tech: "Python · Streamlit · SciPy Optimize"

  - name: "Cheminformatics & ML Repositories"
    subtitle: "Open-Source Python Workflows"
    url: "https://github.com/drsahanawaz"
    status: "Open Source"
    summary: "Scripts and reproducible notebooks for chemical dataset curation, molecular descriptor generation, scaffold-based model validation, and spectroscopic data analysis."
    tech: "Python · RDKit · scikit-learn · GitHub"

# Doctoral Research Foundation
phd:
  title: "Photochromic Receptors for Nucleotide Detection Using Machine Learning Techniques"
  institution: "IISER Kolkata"
  period: "2018 – 2026"
  degree: "PhD in Chemical Sciences"
  supervisor: "Prof. Subhajit Bandyopadhyay"
  text: "Doctoral research investigated photoswitchable tripodal azobenzene receptors capable of differential binding with nucleotide phosphates (ATP, ADP, GTP, UMP, UTP, CTP) and inorganic phosphates. By tracking UV–Vis absorption spectra across both photoisomeric states and applying multivariate statistical analysis (PCA and LDA), the work demonstrated clear analyte discrimination based on optical response patterns, providing the foundation for our current work in data-driven chemistry."

